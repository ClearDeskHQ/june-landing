server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # behind the platform proxy, a redirect names only the path, never the internal port
    absolute_redirect off;

    location = /join-waitlist { return 301 /signup; }
    location = /welcome { return 301 /signup; }
    location = /early-access { return 301 /signup; }

    location /assets/ {
        expires 7d;
    }

    # the app itself signs people in on its own domain, never here
    location = /app/ { return 302 ${APP_URL}; }

    # signup lives on the site's own address: the page, its bundle and its API come from June's web.
    # Host stays the signup host, so the backend hands the owner to the app's domain when done
    location ~ ^/(signup$|app/|join) {
        # resolved per request: the site still starts when the signup host does not resolve
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $signup ${SIGNUP_UPSTREAM};
        rewrite ^/signup$ /app/join break;
        proxy_pass $signup$uri$is_args$args;
        proxy_set_header Host ${SIGNUP_HOST};
        proxy_ssl_server_name on;
        proxy_ssl_name ${SIGNUP_HOST};
        # the BAA record keeps the signer's address: the first in this list
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # until the signup host answers, /signup says so instead of a gateway error
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /signup-soon.html;
    }

    location = /signup-soon.html { internal; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
